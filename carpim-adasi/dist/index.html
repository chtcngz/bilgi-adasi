<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çarpım Adası · Bilgi Adası</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="brand-icon">⛵</span> Bilgi Adası</div><div class="head-right"><span id="stars">⭐ 0 yıldız</span><button id="sound" aria-label="Sesi aç" aria-pressed="false">♫</button></div></header>
<main><div class="crumb">Bilgi Adası <b>›</b> Matematik <b>›</b> Çarpım Adası</div><div class="heading"><div><div class="eyebrow">MATEMATİK MACERASI</div><h1>Çarpım Adası<span>.</span></h1><p>Adaları keşfet, çarpmayı öğren ve yıldızları topla!</p></div><div class="grade">⚑ &nbsp; 2–4. sınıf</div></div>
<div class="layout"><section class="map" aria-label="Keşif haritası"><div class="map-title"><span>✥</span> Keşif haritası</div><canvas id="sea" aria-hidden="true"></canvas><div id="pins"></div><div class="compass">N<br>✥</div></section><aside><div class="eyebrow">SEÇİLİ BÖLÜM</div><div id="mission"></div><button class="primary" id="play">▶ &nbsp; Maceraya başla</button></aside></div>
<section class="progress"><div class="medal">🏆</div><div class="progress-info"><div><strong>Keşif günlüğüm</strong><span id="count"></span></div><div class="track"><i id="bar"></i></div></div></section></main>
<dialog id="game" aria-labelledby="gameTitle"><button id="close" aria-label="Haritaya dön">×</button><div id="stage"></div></dialog><script src="map.js"></script><script src="game.js"></script></body></html>
