<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6fb0"/>
      <stop offset=".45" stop-color="#5aa6d6"/>
      <stop offset=".64" stop-color="#b6e0ee"/>
      <stop offset=".72" stop-color="#fbe6b4"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb6c8"/>
      <stop offset="1" stop-color="#1b6f93"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7a62"/>
      <stop offset="1" stop-color="#6a4f3e"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe0a8"/>
      <stop offset="1" stop-color="#2ea86d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6c8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="800" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1190" cy="168" r="160" fill="url(#glow)"/>
  <g stroke="#ffd45c" stroke-width="10" stroke-linecap="round">
    <path d="M1190 58v-26"/><path d="M1190 304v-26"/><path d="M1080 168h-26"/><path d="M1326 168h-26"/>
    <path d="M1112 90l-18-18"/><path d="M1286 264l-18-18"/><path d="M1268 90l18-18"/><path d="M1094 264l18-18"/>
  </g>
  <circle cx="1190" cy="168" r="70" fill="#ffd45c"/>
  <circle cx="1190" cy="168" r="54" fill="#ffe489"/>

  <!-- the Earth on its orbit -->
  <ellipse cx="1190" cy="168" rx="230" ry="70" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3" stroke-dasharray="10 12"/>
  <g transform="translate(980 206)">
    <circle r="26" fill="#3f8fd2"/>
    <path d="M-14 -16 C-4 -20 6 -12 2 -4 C-2 4 -12 2 -16 8 C-22 0 -22 -10 -14 -16Z" fill="#5fbf6a"/>
    <path d="M8 6 C16 4 22 10 18 18 C12 22 4 18 8 6Z" fill="#5fbf6a"/>
  </g>

  <!-- clouds -->
  <g fill="#ffffff" opacity=".9">
    <path d="M180 170 a34 34 0 0 1 64 -14 a26 26 0 0 1 44 20 a20 20 0 0 1 -6 38 h-96 a24 24 0 0 1 -6 -44Z"/>
    <path d="M760 110 a26 26 0 0 1 50 -10 a20 20 0 0 1 34 16 a16 16 0 0 1 -4 30 h-76 a20 20 0 0 1 -4 -36Z" opacity=".8"/>
  </g>

  <!-- far hills -->
  <path d="M0 560 C120 520 220 530 320 548 C420 520 520 526 600 552 L0 560Z" fill="#86b9a0" opacity=".55"/>
  <path d="M900 556 C1010 522 1130 520 1240 546 C1320 528 1390 534 1440 548 L1440 560 L900 560Z" fill="#86b9a0" opacity=".55"/>

  <!-- sea -->
  <rect y="556" width="1440" height="244" fill="url(#sea)"/>
  <g fill="none" stroke="#e8fbf6" stroke-width="5" stroke-linecap="round" opacity=".55">
    <path d="M90 650 q24 -14 48 0 t48 0"/>
    <path d="M1180 640 q24 -14 48 0 t48 0"/>
    <path d="M1010 730 q24 -14 48 0 t48 0"/>
    <path d="M240 740 q24 -14 48 0 t48 0"/>
    <path d="M1290 760 q20 -12 40 0 t40 0"/>
  </g>

  <!-- volcano -->
  <g>
    <path d="M520 560 L650 330 C664 318 690 318 704 330 L850 560Z" fill="url(#rock)"/>
    <path d="M650 330 C664 318 690 318 704 330 L690 352 C680 344 668 344 660 352Z" fill="#e0533d"/>
    <path d="M662 340 C656 380 640 400 646 440 C652 410 670 392 668 356Z" fill="#f07a3a"/>
    <path d="M690 342 C700 372 716 392 708 430 C700 402 688 384 686 356Z" fill="#f07a3a"/>
    <g fill="#d6d2cc" opacity=".85">
      <circle cx="676" cy="296" r="22"/><circle cx="702" cy="268" r="28"/><circle cx="738" cy="236" r="32"/>
    </g>
  </g>

  <!-- island -->
  <path d="M250 612 C320 560 450 538 640 534 C840 530 1010 548 1100 604 C1010 640 860 656 680 656 C500 656 340 644 250 612Z" fill="#e7bf7c"/>
  <path d="M280 598 C360 556 480 540 640 537 C820 534 980 550 1060 590 C970 612 840 620 680 620 C510 620 370 614 280 598Z" fill="#f4d79f"/>
  <path d="M340 576 C430 548 540 540 640 539 C770 538 900 546 990 572 C890 584 770 588 660 588 C540 588 430 586 340 576Z" fill="#8cc58f"/>

  <!-- lighthouse with its beam -->
  <g>
    <path d="M444 262 L1000 150 L1000 300Z" fill="url(#beam)"/>
    <path d="M396 262 L-40 170 L-40 330Z" fill="url(#beam)" opacity=".7"/>
    <path d="M392 572 L404 300 H436 L448 572Z" fill="#fffaf0"/>
    <path d="M397 470 L444 470 L446 510 L395 510Z" fill="#e2533f"/>
    <path d="M401 380 L440 380 L442 418 L399 418Z" fill="#e2533f"/>
    <rect x="396" y="290" width="48" height="12" rx="3" fill="#36536b"/>
    <rect x="404" y="244" width="32" height="46" rx="4" fill="#fff3a8"/>
    <path d="M400 246 C404 222 436 222 440 246Z" fill="#e2533f"/>
    <path d="M420 224 v-14" stroke="#36536b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- flask -->
  <g transform="translate(600 360)">
    <path d="M38 0 H82 V64 L134 180 C142 200 130 214 110 214 H10 C-10 214 -22 200 -14 180 L38 64Z" fill="#eaf6ff" fill-opacity=".9" stroke="#36536b" stroke-width="6" stroke-linejoin="round"/>
    <path d="M14 136 H106 L130 186 C134 198 126 206 112 206 H8 C-6 206 -14 198 -10 186Z" fill="url(#liquid)"/>
    <rect x="30" y="-10" width="60" height="16" rx="6" fill="#36536b"/>
    <g fill="#ffffff" opacity=".9">
      <circle cx="50" cy="170" r="8"/><circle cx="76" cy="186" r="6"/><circle cx="62" cy="122" r="7"/>
      <circle cx="70" cy="90" r="5"/><circle cx="54" cy="58" r="4"/>
    </g>
  </g>

  <!-- magnet -->
  <g transform="translate(842 452)">
    <path d="M0 0 H34 V64 A30 30 0 0 0 94 64 V0 H128 V64 A64 64 0 0 1 0 64Z" fill="#e2533f"/>
    <rect x="0" y="0" width="34" height="30" fill="#dfe6ec"/>
    <rect x="94" y="0" width="34" height="30" fill="#dfe6ec"/>
    <text x="17" y="24" font-family="Nunito, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="middle" fill="#36536b">N</text>
    <text x="111" y="24" font-family="Nunito, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="middle" fill="#36536b">S</text>
    <g fill="none" stroke="#36536b" stroke-width="4" stroke-linecap="round" opacity=".6">
      <path d="M17 -14 C20 -48 108 -48 111 -14"/>
      <path d="M17 -10 C14 -74 114 -74 111 -10"/>
    </g>
  </g>

  <!-- wind turbine -->
  <g>
    <path d="M1022 590 L1030 380 H1040 L1048 590Z" fill="#f4f7fa"/>
    <g transform="translate(1035 376)">
      <path d="M0 0 C10 -40 6 -90 0 -110 C-6 -90 -10 -40 0 0Z" fill="#ffffff"/>
      <path d="M0 0 C-38 14 -78 42 -94 56 C-74 54 -32 28 0 0Z" fill="#ffffff"/>
      <path d="M0 0 C34 22 66 58 76 76 C58 66 28 34 0 0Z" fill="#ffffff"/>
      <circle r="10" fill="#36536b"/>
    </g>
  </g>

  <!-- rocks and a fossil -->
  <g>
    <path d="M300 600 C304 584 330 578 346 588 C356 594 352 606 340 608 H306Z" fill="#a08670"/>
    <path d="M318 596 a10 10 0 1 1 10 6 a6 6 0 1 1 -4 -6" fill="none" stroke="#f4e7d4" stroke-width="3" stroke-linecap="round"/>
    <path d="M940 600 C946 588 966 586 976 594 C982 600 978 608 970 608 H944Z" fill="#8f7562"/>
  </g>

  <!-- boat -->
  <g>
    <path d="M160 664 H290 L270 694 H182Z" fill="#c9693c"/>
    <path d="M226 660 V572" stroke="#6b4a2e" stroke-width="5"/>
    <path d="M230 576 L286 652 H230Z" fill="#fff8e6"/>
    <path d="M222 590 L182 652 H222Z" fill="#ffe2a8"/>
    <path d="M226 572 l18 6 -18 6z" fill="#2a6fb0"/>
  </g>
</svg>
