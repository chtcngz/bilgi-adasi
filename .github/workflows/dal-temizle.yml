name: Dal temizliği
# The owner's rule (CLAUDE.md, Going live): a branch whose work is in main is deleted. Claude's cloud sessions may not
# delete branches, so this runs on GitHub after every push to main and deletes each claude/* branch that main already
# contains (its last commit is in main's history). A branch with even one commit main lacks is left alone.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dal-temizle
  cancel-in-progress: true
jobs:
  delete-merged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete the claude/* branches already in main
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          deleted=0
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/claude/'); do
            branch="${ref#origin/}"
            if git merge-base --is-ancestor "$ref" origin/main; then
              git push origin --delete "$branch" && deleted=$((deleted + 1)) && echo "silindi: $branch"
            else
              echo "kaldı (main'de olmayan commit var): $branch"
            fi
          done
          echo "Silinen dal: $deleted"
