name: Çarpım Adası Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp the version shown in the game
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must look like 0.1.0, found '$version'"
            exit 1
          fi
          stamp="$version · $(TZ=Europe/Istanbul date +'%d.%m.%Y %H:%M')"
          sed -i "s|__SURUM__|$stamp|" carpim-adasi/dist/index.html
          grep -o '<meta name="surum"[^>]*>' carpim-adasi/dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: carpim-adasi/dist
  publish:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
