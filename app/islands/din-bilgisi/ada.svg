<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5a70"/>
      <stop offset=".42" stop-color="#3f8e98"/>
      <stop offset=".62" stop-color="#9fc9b4"/>
      <stop offset=".72" stop-color="#f6cf92"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5bbab3"/>
      <stop offset="1" stop-color="#17707a"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fa59a"/>
      <stop offset="1" stop-color="#1d6f6c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1440" height="800" fill="#fff"/>
      <circle cx="1222" cy="142" r="64" fill="#000"/>
    </mask>
  </defs>

  <rect width="1440" height="800" fill="url(#sky)"/>

  <!-- moon and stars -->
  <circle cx="1190" cy="168" r="150" fill="url(#glow)"/>
  <circle cx="1190" cy="168" r="72" fill="#fff3c4" mask="url(#crescent)"/>
  <g fill="#fff6d8">
    <path d="M1060 90l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/>
    <path d="M1330 260l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
    <path d="M880 120l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" opacity=".85"/>
    <circle cx="960" cy="60" r="3"/><circle cx="1110" cy="250" r="3" opacity=".8"/>
    <circle cx="1390" cy="110" r="3.5"/><circle cx="770" cy="70" r="2.5" opacity=".7"/>
    <circle cx="290" cy="80" r="3" opacity=".75"/><circle cx="170" cy="170" r="2.5" opacity=".6"/>
    <path d="M420 120l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" opacity=".8"/>
  </g>

  <!-- far hills -->
  <path d="M0 560 C120 520 220 530 320 548 C420 520 520 526 600 552 L0 560Z" fill="#7fb7a4" opacity=".55"/>
  <path d="M900 556 C1010 522 1130 520 1240 546 C1320 528 1390 534 1440 548 L1440 560 L900 560Z" fill="#7fb7a4" opacity=".55"/>

  <!-- sea -->
  <rect y="556" width="1440" height="244" fill="url(#sea)"/>
  <g fill="none" stroke="#e8fbf6" stroke-width="5" stroke-linecap="round" opacity=".55">
    <path d="M90 650 q24 -14 48 0 t48 0"/>
    <path d="M1180 640 q24 -14 48 0 t48 0"/>
    <path d="M1010 730 q24 -14 48 0 t48 0"/>
    <path d="M240 740 q24 -14 48 0 t48 0"/>
    <path d="M1290 760 q20 -12 40 0 t40 0"/>
  </g>

  <!-- island -->
  <path d="M270 612 C330 560 450 538 640 534 C840 530 990 548 1080 604 C1000 640 860 656 680 656 C500 656 350 644 270 612Z" fill="#e7bf7c"/>
  <path d="M300 598 C370 556 480 540 640 537 C820 534 960 550 1040 590 C960 612 840 620 680 620 C510 620 380 614 300 598Z" fill="#f4d79f"/>
  <path d="M360 576 C440 548 540 540 640 539 C760 538 880 546 970 572 C880 584 770 588 660 588 C540 588 440 586 360 576Z" fill="#8cc58f"/>

  <!-- mosque -->
  <g>
    <!-- minarets -->
    <rect x="404" y="300" width="26" height="268" rx="4" fill="#fff4dc"/>
    <rect x="398" y="364" width="38" height="12" rx="3" fill="#e6d3ac"/>
    <rect x="400" y="440" width="34" height="10" rx="3" fill="#e6d3ac"/>
    <path d="M401 302 L417 214 L433 302Z" fill="url(#dome)"/>
    <path d="M417 214 v-22" stroke="#f2c35b" stroke-width="4" stroke-linecap="round"/>
    <rect x="890" y="300" width="26" height="268" rx="4" fill="#fff4dc"/>
    <rect x="884" y="364" width="38" height="12" rx="3" fill="#e6d3ac"/>
    <rect x="886" y="440" width="34" height="10" rx="3" fill="#e6d3ac"/>
    <path d="M887 302 L903 214 L919 302Z" fill="url(#dome)"/>
    <path d="M903 214 v-22" stroke="#f2c35b" stroke-width="4" stroke-linecap="round"/>

    <!-- wings -->
    <rect x="452" y="470" width="120" height="98" rx="6" fill="#fff4dc"/>
    <rect x="748" y="470" width="120" height="98" rx="6" fill="#fff4dc"/>
    <path d="M466 472 A46 46 0 0 1 558 472Z" fill="url(#dome)"/>
    <path d="M762 472 A46 46 0 0 1 854 472Z" fill="url(#dome)"/>

    <!-- main hall and dome -->
    <rect x="540" y="430" width="240" height="138" rx="8" fill="#fffaf0"/>
    <rect x="566" y="404" width="188" height="30" rx="6" fill="#fff4dc"/>
    <path d="M560 406 A100 100 0 0 1 760 406Z" fill="url(#dome)"/>
    <path d="M588 380 A78 78 0 0 1 640 322" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="9" stroke-linecap="round"/>
    <path d="M660 306 v-34" stroke="#f2c35b" stroke-width="5" stroke-linecap="round"/>
    <path d="M672 252 a16 16 0 1 0 0 26 a12 12 0 1 1 0 -26Z" fill="#f2c35b"/>

    <!-- door and windows -->
    <path d="M630 568 V516 A30 30 0 0 1 690 516 V568Z" fill="#1d6f6c"/>
    <path d="M640 568 V520 A20 20 0 0 1 680 520 V568Z" fill="#2a8c84"/>
    <g fill="#2a8c84">
      <path d="M572 478 v-14 a12 12 0 0 1 24 0 v14z"/>
      <path d="M724 478 v-14 a12 12 0 0 1 24 0 v14z"/>
      <path d="M484 530 v-18 a12 12 0 0 1 24 0 v18z"/>
      <path d="M516 530 v-18 a12 12 0 0 1 24 0 v18z"/>
      <path d="M780 530 v-18 a12 12 0 0 1 24 0 v18z"/>
      <path d="M812 530 v-18 a12 12 0 0 1 24 0 v18z"/>
    </g>
    <rect x="440" y="562" width="440" height="10" rx="5" fill="#e6d3ac"/>
  </g>

  <!-- palm -->
  <g>
    <path d="M1000 600 C1004 540 996 480 1020 420" fill="none" stroke="#9b6a3b" stroke-width="16" stroke-linecap="round"/>
    <g fill="#3f9a5c">
      <path d="M1020 420 C980 392 930 396 900 430 C944 418 984 420 1020 428Z"/>
      <path d="M1020 420 C1060 388 1110 392 1140 426 C1096 414 1056 418 1020 428Z"/>
      <path d="M1020 420 C1000 380 1006 344 1036 322 C1028 360 1030 392 1024 424Z"/>
      <path d="M1020 420 C1048 400 1096 420 1112 466 C1080 438 1050 430 1022 428Z"/>
      <path d="M1020 420 C990 404 944 428 932 474 C962 444 992 434 1018 428Z"/>
    </g>
    <circle cx="1014" cy="432" r="9" fill="#7a4b22"/><circle cx="1030" cy="434" r="8" fill="#7a4b22"/>
  </g>

  <!-- boat -->
  <g>
    <path d="M160 664 H290 L270 694 H182Z" fill="#c9693c"/>
    <path d="M226 660 V572" stroke="#6b4a2e" stroke-width="5"/>
    <path d="M230 576 L286 652 H230Z" fill="#fff8e6"/>
    <path d="M222 590 L182 652 H222Z" fill="#ffe2a8"/>
    <path d="M226 572 l18 6 -18 6z" fill="#e2735f"/>
  </g>

  <!-- book on a lectern (rahle), beside the mosque -->
  <g transform="translate(350 594)">
    <path d="M-38 30 L0 4 L38 30" fill="none" stroke="#9b6a3b" stroke-width="7" stroke-linecap="round"/>
    <path d="M0 4 C-14 -6 -32 -8 -46 -4 V16 C-32 12 -14 14 0 22Z" fill="#fffaf0"/>
    <path d="M0 4 C14 -6 32 -8 46 -4 V16 C32 12 14 14 0 22Z" fill="#fff4dc"/>
    <path d="M0 4 V22" stroke="#1d6f6c" stroke-width="3"/>
  </g>
</svg>
