<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9784a"/>
      <stop offset=".38" stop-color="#eea36a"/>
      <stop offset=".6" stop-color="#f8cf96"/>
      <stop offset=".72" stop-color="#fde8c2"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#47aebb"/>
      <stop offset="1" stop-color="#1d6a86"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
