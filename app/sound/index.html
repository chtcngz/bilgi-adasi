<!doctype html>
<!-- Sesler (…/bilgi-adasi/sound/): the owner's page for choosing Elif Ba's recordings. Not linked from the game.
     Three tabs: 📂 Bölümler (the sections; only Harekesiz, Harekeli and Tenvin have rows, the others are titles until they
     are made again), ✓ Seçilenler (the clips the owner chose, sound/secimler.js) and 🎙 Seslendirilecekler (the readings
     with no suitable clip, to be recorded again). In a section every reading is a row with, on the left, the girl's clip the
     game plays now (assets/audio/elif-ba/kayitlar.js; the man's clips stay there but are not shown) and, on the right, the
     new clips cut from the owner's recordings (sound-samples/ → tools/ses_kes.py → sound/ses/<id>.mp3, sound/liste.js).
     A new choice (✓ Onayla, ⇄ Bunu kullan) stays in this browser (localStorage); "Seçimleri kopyala" copies the ones not
     in secimler.js yet, as text to paste to Claude. <base href="../"> makes every path resolve to app/, as the game's own. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sesler · Elif Ba</title>
<link rel="stylesheet" href="sound/sayfa.css?v=3">
</head>
<body>
<header class="ust">
  <div class="ust-satir">
    <h1 id="baslik">🔊 Sesler</h1>
    <button type="button" id="kopyala" class="btn ana">📋 Seçim ve yorumları kopyala</button>
  </div>
  <nav id="sekmeler" class="sekmeler" role="tablist" aria-label="Sekmeler"></nav>
  <div id="arac" class="arac" hidden>
    <div id="filtreler" class="filtreler" role="group" aria-label="Filtre"></div>
    <input id="ara" type="search" placeholder="🔍 Ara (be, iki ötre …)" autocomplete="off" aria-label="Ara">
  </div>
  <div id="sutunlar" class="sutunlar" hidden><span>🎮 Oyunda (kız sesi)</span><span>✨ Yeni kayıtlar</span></div>
  <textarea id="kopya" hidden readonly aria-label="Seçimler ve yorumlar"></textarea>
</header>
<main id="ana"></main>
<div id="durum" role="status"></div>
<script src="assets/audio/elif-ba/kayitlar.js?v=12"></script>
<script src="islands/elif-ba/data.js?v=12"></script>
<script src="sound/liste.js?v=4"></script>
<script src="sound/secimler.js?v=1"></script>
<script src="sound/adaylar.js?v=1"></script>
<script src="sound/sayfa.js?v=4"></script>
</body>
</html>
