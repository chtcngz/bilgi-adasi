<!doctype html>
<!-- Sesler (…/bilgi-adasi/sound/): the owner's page for choosing Elif Ba's recordings. Not linked from the game.
     It opens on the sections (harekesiz, harekeli, tenvin, cezm, şedde …); in a section every reading is a row with, on the
     left, the clips the game plays now (assets/audio/elif-ba/kayitlar.js: the girl's voice and the man's) and, on the right,
     the clips cut from the owner's recordings (sound-samples/ → tools/ses_kes.py → sound/ses/<id>.mp3, sound/liste.js).
     The owner approves the game clips that are good (✓) and picks a new clip for the ones that are not (⇄); the choices stay
     in this browser (localStorage) and "Seçimleri kopyala" copies them as text to paste to Claude.
     <base href="../"> makes every path resolve to app/, as the game's own. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sesler · Elif Ba</title>
<link rel="stylesheet" href="sound/sayfa.css?v=1">
</head>
<body>
<header class="ust">
  <div class="ust-satir">
    <button type="button" id="geri" class="btn geri" hidden>‹ Bölümler</button>
    <h1 id="baslik">🔊 Sesler</h1>
    <button type="button" id="kopyala" class="btn ana">📋 Seçimleri kopyala</button>
  </div>
  <div id="arac" class="arac" hidden>
    <div id="filtreler" class="filtreler" role="group" aria-label="Filtre"></div>
    <input id="ara" type="search" placeholder="🔍 Ara (be, iki ötre …)" autocomplete="off" aria-label="Ara">
  </div>
  <div id="sutunlar" class="sutunlar" hidden><span>🎮 Oyunda</span><span>✨ Yeni kayıtlar</span></div>
  <textarea id="kopya" hidden readonly aria-label="Seçimler"></textarea>
</header>
<main id="ana"></main>
<div id="durum" role="status"></div>
<script src="assets/audio/elif-ba/kayitlar.js?v=12"></script>
<script src="islands/elif-ba/data.js?v=12"></script>
<script src="sound/liste.js?v=3"></script>
<script src="sound/sayfa.js?v=1"></script>
</body>
</html>
