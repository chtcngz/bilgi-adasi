<!doctype html>
<!-- Sesler (…/bilgi-adasi/sound/): the owner's page for choosing Elif Ba's recordings. Not linked from the game.
     Four sections, opened from tiles: 1 Harekeli, harekesiz ve tenvin; 2 Cezm; 3 Şedde; 4 Uzatma (only a title until
     its clips are made). Inside a section: ✓ Seçilenler (the clips the owner chose, sound/secimler.js), 🎙 Seslendirilecekler
     (the readings with no suitable clip, to be recorded again) and its parts, every reading a row with, on the left, the
     clip the game plays now (assets/audio/elif-ba/kayitlar.js: the girl's in section 1, where the man's clips stay but are
     not shown; the man's in Cezm and Şedde, whose islets play only his) and, on the right, the new clips cut from the
     owner's recordings (sound-samples/ → tools/ses_kes.py → sound/ses/<id>.mp3, sound/liste.js).
     A new choice (✓ Onayla, ⇄ Bunu kullan) stays in this browser (localStorage); "Seçimleri kopyala" copies the ones not
     in secimler.js yet, as text to paste to Claude. <base href="../"> makes every path resolve to app/, as the game's own. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sesler · Elif Ba</title>
<link rel="stylesheet" href="sound/sayfa.css?v=5">
</head>
<body>
<header class="ust">
  <div class="ust-satir">
    <button type="button" id="geri" class="btn geri" hidden>‹ Bölümler</button>
    <h1 id="baslik">🔊 Sesler</h1>
    <button type="button" id="kopyala" class="btn ana">📋 <span class="uzun">Seçim ve yorumları </span>kopyala</button>
  </div>
  <nav id="sekmeler" class="sekmeler" role="tablist" aria-label="Sekmeler" hidden></nav>
  <div id="arac" class="arac" hidden>
    <div id="filtreler" class="filtreler" role="group" aria-label="Filtre"></div>
    <input id="ara" type="search" placeholder="🔍 Ara (be, iki ötre …)" autocomplete="off" aria-label="Ara">
  </div>
  <div id="sutunlar" class="sutunlar" hidden><span>🎮 Oyunda (kız sesi)</span><span>✨ Yeni kayıtlar</span></div>
  <textarea id="kopya" hidden readonly aria-label="Seçimler ve yorumlar"></textarea>
</header>
<main id="ana"></main>
<div id="durum" role="status"></div>
<script src="assets/audio/elif-ba/kayitlar.js?v=14"></script>
<script src="islands/elif-ba/data.js?v=12"></script>
<script src="sound/liste.js?v=4"></script>
<script src="sound/secimler.js?v=8"></script>
<script src="sound/adaylar.js?v=2"></script>
<script src="sound/dad.js?v=3"></script>
<script src="sound/sayfa.js?v=13"></script>
</body>
</html>
